$kind: http-request
name: GET /users/me
url: "{{baseUrl}}/api/v1/users/me"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('No passwordHash exposed', () => pm.expect(pm.response.json().data.passwordHash).to.not.exist);
order: 1000
