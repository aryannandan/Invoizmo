$kind: http-request
name: GET /ready (Readiness)
url: "{{baseUrl}}/ready"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Database ready', () => pm.expect(pm.response.json().database).to.eql('connected'));
order: 2000
